<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mizan</title>
    <meta name="description" content="mizan est une platform qui met en disponibilité de ses utilisateurs tous les changements qui concernent les metaux.">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="src/app.js" defer></script>
</head>
<body>
    <header class="bg-blue-950 py-2 flex">
        <div>
            <img class="w-40 h-20" src="assets/images/Balance de justice dorée sur fond transparent.png" alt="logo de mizan">
        </div>
        <div>
            <h1 class="text-white font-serif text-5xl py-3  ">Mizan</h1>
        </div>
    </header>
    <main>
        <section class="flex justify-end">
            <div>
                <h1 class="text-4xl font-bold flex justify-start pt-30 flex-nowrap">Suivez les prix de l'or et de l'argent</h1>
                <h4 class="text-xl font-serif pt-4 ">Restez informer des derniers changements en temps réel</h4>
            </div>
            <div class="flex  py-0">
                <img class="h-80 w-150" src="assets/images/hero.png" alt="hero de mizan">
            </div>
        </section>

        <section class="flex gap-20 mx-10">
            <article class="w-150">
                <div class="flex bg-blue-950 gap-40 border rounded-t-2xl h-20 justify-evenly ">
                    <h1 class="text-white text-2xl font-serif py-5 px-5">Prix du jour</h1>
                    <p class="text-white font-mono py-7"> time </p>
                </div>
            </article>

            <article class="w-150">
                <div class="flex bg-blue-950 gap-40 border rounded-t-2xl h-20 justify-evenly">
                    <h1 class="text-white text-2xl font-serif py-5 px-5">Estimer la valeur d'un bijoux</h1>
                </div>
                <div>
                    <h2 class="font-semibold pt-10 px-10">Poids (en gramme):</h2>
                    <input class="border rounded-full border-black w-100 h-10 mx-10 " type="number" placeholder="Exemple:10">
                </div>
            </article>
        </section>












    </main>
    
</body>
</html>
